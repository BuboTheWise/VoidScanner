# F-Droid Manual Repository CI
# Updates the manual repo when app/build.gradle or fdroid/ changes.
# Requires: Pages deployment enabled in GitHub Settings → Pages (Source = Actions)

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle'
      - 'app/src/**'
      - 'gradle.properties'
      - 'fdroid/**'
      - '.github/workflows/fdroid.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANDROID_HOME: ${{ github.workspace }}/Android/Sdk
  KEYSTORE_FILE: ./app/voidscanner.keystore
  KEY_ALIAS: "voidscanner"
  # The keystore is already committed in app/voidscanner.keystore (PKCS12)
  # If you ever need to regenerate it, see DEVSETUP.md

jobs:
  update-repo:
    name: Update F-Droid Repo
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. Install dependencies ---
      - name: Install Java (for gradle + jarsigner verification)
        run: |
          apt-get update && apt-get install -y openjdk-17-jdk-headless git curl wget unzip
          chmod +x gradlew
      - name: Install fdroidserver
        run: pip install fdroidserver

      # --- 2. Build APK ---
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        
      - name: Show build output
        run: ls - lah app/build/outputs/apk/debug/

      # --- 3. Update F-Droid repo ---
      - name: Update fdroid repo index
        id: update
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          # Copy new debug APK to repo with versioned name
          VERSION_NAME=$(grep APP_VERSION_NAME gradle.properties | cut -d'=' -f2)
          TARGET="void-scanner-${VERSION_NAME}-debug.apk"
          cp "$APK_PATH" "fdroid/repo/$TARGET"
          
          # Verify the APK is valid
          jarsigner -verify -verbose "$APK_PATH" 2>&1 | head -5
          
          echo "apk=$TARGET" >> $GITHUB_OUTPUT
          chmod +x fdroid/validate_fdroid_repo.py

      - name: Fix repo/index.xml with fdidx
        run: |
          cd fdroid/repo
          # Add the new APK to the index (updates hash/sig)
          python3 validate_fdroid_repo.py --fix-index 2>&1 || true
          echo "Index after fix:"
          head -30 index.xml

      # --- 4. Deploy to GitHub Pages ---
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid/repo
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
